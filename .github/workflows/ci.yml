name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint + typecheck + build + unit tests (with coverage report, no hard gate).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # End-to-end across Chromium/Firefox/WebKit against the production build.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Some ubuntu-26.04 runner images ship a packages.microsoft.com apt source
      # that answers 403 / "no longer signed", which aborts the `apt-get update`
      # behind `--with-deps`. Playwright doesn't need it, so drop it first.
      - name: Remove broken Microsoft apt source
        run: |
          files=$(grep -rlE 'packages\.microsoft\.com' /etc/apt/sources.list.d/ || true)
          if [ -n "$files" ]; then echo "Removing: $files"; sudo rm -f $files; fi
      - run: pnpm exec playwright install --with-deps
      - run: pnpm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
